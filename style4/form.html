<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Portfolio — Style 4</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:      #2e7d32;
      --primary-dark: #1b5e20;
      --secondary:    #f5f5f5;
      --dark:         #212121;
      --gray:         #757575;
      --light-gray:   #e0e0e0;
      --white:        #ffffff;
      --ac:           #2e7d32;
      --g1:           #f1f8e9;
      --g2:           #e8f5e9;
      --shadow:       0 4px 15px rgba(0,0,0,0.08);
      --radius:       8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: var(--dark);
      line-height: 1.6;
      padding: 40px 20px 100px;
      min-height: 100vh;
    }

    .wrap { max-width: 960px; margin: 0 auto; }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      color: var(--dark);
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 3px solid var(--ac);
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 28px 30px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-2px); }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary);
      border-bottom: 1px solid var(--light-gray);
      padding-bottom: 10px;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.88rem;
      color: #495057;
      margin: 16px 0 6px;
    }
    label:first-of-type { margin-top: 0; }

    input, textarea, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--light-gray);
      border-radius: 5px;
      font-family: inherit;
      font-size: 0.95rem;
      background: var(--secondary);
      color: var(--dark);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(46,125,50,0.12);
      background: white;
    }

    textarea { min-height: 90px; resize: vertical; }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

    /* ── Buttons ──────────────────────────────────────────── */
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.92rem;
      font-family: inherit;
      font-weight: 500;
      margin-top: 14px;
      margin-right: 8px;
      transition: opacity 0.2s, transform 0.15s;
    }
    button:hover { opacity: 0.85; transform: translateY(-1px); }

    .btn-red  { background: #c62828; }
    .btn-red:hover { background: #b71c1c; }
    .btn-gray { background: #616161; }
    .btn-dl   { background: #2e7d32; }
    .btn-dl:hover { background: #1b5e20; }

    /* ── Dynamic blocks ──────────────────────────────────── */
    .dblock {
      background: var(--secondary);
      border-left: 3px solid var(--primary);
      border-radius: 6px;
      padding: 16px 18px;
      margin: 12px 0;
      position: relative;
    }
    .dblock h3 {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .rm-btn {
      position: absolute;
      top: 10px; right: 10px;
      width: 26px; height: 26px;
      background: #c62828;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0; padding: 0;
      transition: background 0.2s;
      line-height: 1;
    }
    .rm-btn:hover { background: #b71c1c; transform: none; }

    /* ── Level row ───────────────────────────────────────── */
    .level-row { display: flex; align-items: center; gap: 12px; }
    .level-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      background: var(--light-gray);
      border-radius: 4px;
      padding: 0; border: none;
    }
    .level-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .lval {
      font-weight: 700;
      font-size: 0.85rem;
      min-width: 40px;
      text-align: center;
      color: var(--dark);
    }

    /* ── Theme Picker ────────────────────────────────────── */
    .preset-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }

    .preset-swatch {
      width: 46px; height: 46px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }
    .preset-swatch:hover { transform: scale(1.12); }
    .preset-swatch.active { border-color: var(--dark); transform: scale(1.1); }
    .preset-swatch .ac-dot {
      position: absolute;
      bottom: 2px; right: 2px;
      width: 13px; height: 13px;
      border-radius: 50%;
      border: 2px solid white;
    }

    .pickers-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .picker-grp label { margin: 0 0 8px; font-size: 0.85rem; }
    .picker-inner { display: flex; align-items: center; gap: 8px; }
    .picker-inner input[type="color"] {
      width: 40px; height: 40px;
      border: none; border-radius: 5px;
      cursor: pointer; padding: 0; flex-shrink: 0;
    }
    .picker-inner input[type="text"] {
      flex: 1; width: auto;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.88rem;
      text-transform: uppercase;
    }
    .preview-strip { height: 10px; border-radius: 5px; margin-top: 14px; transition: background 0.3s; }

    /* ── Action Bar ──────────────────────────────────────── */
    .action-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 2px solid var(--primary);
      padding: 12px 24px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      z-index: 100;
      box-shadow: 0 -4px 14px rgba(0,0,0,0.10);
    }
    .action-bar button { margin: 0; }

    /* ── Toast ───────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 76px; right: 20px;
      background: white;
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      padding: 13px 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.14);
      font-size: 0.92rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 200;
      max-width: 300px;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { border-left-color: #c62828; }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 700px) {
      .two-col, .three-col, .pickers-row { grid-template-columns: 1fr; }
      body { padding: 20px 14px 100px; }
      .card { padding: 18px; }
      .action-bar button { flex: 1; min-width: 100px; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <h1><i class="fas fa-pencil-alt"></i> Edit Portfolio</h1>

  <!-- ── THEME ──────────────────────────────────────────────── -->
  <div class="card">
    <h2>Theme Colors</h2>
    <div class="preset-row" id="presetRow"></div>
    <div class="pickers-row">
      <div class="picker-grp">
        <label>Gradient Start</label>
        <div class="picker-inner">
          <input type="color" id="cG1" value="#f1f8e9">
          <input type="text"  id="cG1h" value="#F1F8E9" maxlength="7">
        </div>
      </div>
      <div class="picker-grp">
        <label>Gradient End</label>
        <div class="picker-inner">
          <input type="color" id="cG2" value="#e8f5e9">
          <input type="text"  id="cG2h" value="#E8F5E9" maxlength="7">
        </div>
      </div>
      <div class="picker-grp">
        <label>Accent Color</label>
        <div class="picker-inner">
          <input type="color" id="cAC" value="#2e7d32">
          <input type="text"  id="cACh" value="#2E7D32" maxlength="7">
        </div>
      </div>
    </div>
    <div class="preview-strip" id="previewStrip"></div>
  </div>

  <!-- ── PROFILE ────────────────────────────────────────────── -->
  <div class="card">
    <h2>Profile</h2>
    <div class="two-col">
      <div>
        <label for="profileImage">Profile Image Path</label>
        <input type="text" id="profileImage" placeholder="assets/profile.jpg">
      </div>
      <div>
        <label for="profileEyebrow">Eyebrow Label</label>
        <input type="text" id="profileEyebrow" placeholder="Open to Opportunities">
      </div>
    </div>
  </div>

  <!-- ── BASIC INFO ─────────────────────────────────────────── -->
  <div class="card">
    <h2>Basic Information</h2>
    <label for="inp-name">Full Name *</label>
    <input type="text" id="inp-name" placeholder="Morgan Maxwell" required>

    <label for="inp-title">Professional Title</label>
    <input type="text" id="inp-title" placeholder="Graphic Designer & Brand Specialist">

    <label for="inp-about">About / Bio</label>
    <textarea id="inp-about" placeholder="Describe your professional background…"></textarea>
  </div>

  <!-- ── HERO ───────────────────────────────────────────────── -->
  <div class="card">
    <h2>Hero Section</h2>
    <div class="two-col">
      <div>
        <label for="heroDesc">Hero Description</label>
        <input type="text" id="heroDesc" placeholder="Creating visual experiences that tell stories">
      </div>
      <div>
        <label for="heroImage">Hero Image Path</label>
        <input type="text" id="heroImage" placeholder="assets/designer-work.jpg">
      </div>
    </div>
  </div>

  <!-- ── STATS ──────────────────────────────────────────────── -->
  <div class="card">
    <h2>Stats</h2>
    <div id="stats-container"></div>
    <button type="button" onclick="addStat()"><i class="fas fa-plus"></i> Add Stat</button>
  </div>

  <!-- ── SKILLS ─────────────────────────────────────────────── -->
  <div class="card">
    <h2>Skills</h2>
    <div id="skills-container"></div>
    <button type="button" onclick="addSkill()"><i class="fas fa-plus"></i> Add Skill</button>
  </div>

  <!-- ── LANGUAGES ──────────────────────────────────────────── -->
  <div class="card">
    <h2>Languages</h2>
    <div id="languages-container"></div>
    <button type="button" onclick="addLanguage()"><i class="fas fa-plus"></i> Add Language</button>
  </div>

  <!-- ── EXPERIENCE ─────────────────────────────────────────── -->
  <div class="card">
    <h2>Work Experience</h2>
    <div id="experience-container"></div>
    <button type="button" onclick="addExperience()"><i class="fas fa-plus"></i> Add Experience</button>
  </div>

  <!-- ── EDUCATION ──────────────────────────────────────────── -->
  <div class="card">
    <h2>Education</h2>
    <div id="education-container"></div>
    <button type="button" onclick="addEducation()"><i class="fas fa-plus"></i> Add Education</button>
  </div>

  <!-- ── AWARDS ─────────────────────────────────────────────── -->
  <div class="card">
    <h2>Awards</h2>
    <div id="awards-container"></div>
    <button type="button" onclick="addAward()"><i class="fas fa-plus"></i> Add Award</button>
  </div>

  <!-- ── REFERENCES ─────────────────────────────────────────── -->
  <div class="card">
    <h2>References</h2>
    <div id="references-container"></div>
    <button type="button" onclick="addReference()"><i class="fas fa-plus"></i> Add Reference</button>
  </div>

  <!-- ── CONTACT ────────────────────────────────────────────── -->
  <div class="card">
    <h2>Contact Information</h2>
    <div class="three-col">
      <div>
        <label for="inp-phone">Phone</label>
        <input type="tel"   id="inp-phone"   placeholder="+123-456-7890">
      </div>
      <div>
        <label for="inp-email">Email</label>
        <input type="email" id="inp-email"   placeholder="you@example.com">
      </div>
      <div>
        <label for="inp-address">Address / Location</label>
        <input type="text"  id="inp-address" placeholder="123 Anywhere St., Any City">
      </div>
    </div>
  </div>

  <!-- ── FOOTER & SOCIALS ───────────────────────────────────── -->
  <div class="card">
    <h2>Footer &amp; Socials</h2>
    <label for="inp-footer">Footer Text</label>
    <input type="text" id="inp-footer" placeholder="© {year} Your Name. All rights reserved.">
    <p style="font-size:0.8rem;color:#999;margin-top:5px">Use <code>{year}</code> for the current year.</p>

    <label style="margin-top:20px">Social Links</label>
    <p style="font-size:0.8rem;color:#999;margin-bottom:8px">
      Icon: use a Font Awesome class, e.g. <code>fab fa-linkedin</code>, <code>fab fa-dribbble</code>
    </p>
    <div id="social-container"></div>
    <button type="button" onclick="addSocial()"><i class="fas fa-plus"></i> Add Social Link</button>
  </div>

</div><!-- /.wrap -->

<!-- ── ACTION BAR ─────────────────────────────────────────── -->
<div class="action-bar">
  <input type="file" id="loadFileInput" accept=".json" style="display:none" onchange="handleLoad(event)">
  <button type="button" class="btn-gray" onclick="document.getElementById('loadFileInput').click()">
    <i class="fas fa-upload"></i> Load JSON
  </button>
  <button type="button" class="btn-dl" onclick="generateAndDownload()">
    <i class="fas fa-file-download"></i> Generate &amp; Download
  </button>
  <button type="button" onclick="openPreview()">
    <i class="fas fa-eye"></i> Preview
  </button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── Presets ───────────────────────────────────────────────────────────────
const PRESETS = [
  { label: 'Forest',   g1: '#f1f8e9', g2: '#e8f5e9', ac: '#2e7d32' },
  { label: 'Ocean',    g1: '#e3f2fd', g2: '#bbdefb', ac: '#1565c0' },
  { label: 'Crimson',  g1: '#fce4ec', g2: '#f8bbd0', ac: '#c62828' },
  { label: 'Purple',   g1: '#f3e5f5', g2: '#e1bee7', ac: '#6a1b9a' },
  { label: 'Slate',    g1: '#0f172a', g2: '#1e293b', ac: '#38bdf8' },
  { label: 'Amber',    g1: '#fff8e1', g2: '#ffecb3', ac: '#e65100' },
  { label: 'Teal',     g1: '#e0f2f1', g2: '#b2dfdb', ac: '#00695c' },
  { label: 'Dark',     g1: '#212121', g2: '#424242', ac: '#ffd600' },
];

function buildPresets() {
  const row = document.getElementById('presetRow');
  PRESETS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'preset-swatch' + (i === 0 ? ' active' : '');
    btn.title = p.label;
    btn.style.background = `linear-gradient(135deg, ${p.g1}, ${p.g2})`;
    const dot = document.createElement('span');
    dot.className = 'ac-dot';
    dot.style.background = p.ac;
    btn.appendChild(dot);
    btn.addEventListener('click', () => applyPreset(i));
    row.appendChild(btn);
  });
}

function applyPreset(i) {
  const p = PRESETS[i];
  setVals(p.g1, p.g2, p.ac);
  applyTheme(p.g1, p.g2, p.ac);
  document.querySelectorAll('.preset-swatch').forEach((s, j) => s.classList.toggle('active', j === i));
}

function setVals(g1, g2, ac) {
  document.getElementById('cG1').value  = g1;
  document.getElementById('cG1h').value = g1.toUpperCase();
  document.getElementById('cG2').value  = g2;
  document.getElementById('cG2h').value = g2.toUpperCase();
  document.getElementById('cAC').value  = ac;
  document.getElementById('cACh').value = ac.toUpperCase();
  updateStrip();
}

function applyTheme(g1, g2, ac) {
  const r = document.documentElement;
  r.style.setProperty('--g1', g1);
  r.style.setProperty('--g2', g2);
  r.style.setProperty('--ac', ac);
  r.style.setProperty('--primary', ac);
  document.body.style.background = `linear-gradient(135deg, ${g1}, ${g2})`;
  updateStrip();
}

function updateStrip() {
  document.getElementById('previewStrip').style.background =
    `linear-gradient(to right, ${document.getElementById('cG1').value}, ${document.getElementById('cAC').value}, ${document.getElementById('cG2').value})`;
}

function wirePicker(pId, hId) {
  const p = document.getElementById(pId), h = document.getElementById(hId);
  p.addEventListener('input', () => {
    h.value = p.value.toUpperCase();
    document.querySelectorAll('.preset-swatch').forEach(s => s.classList.remove('active'));
    applyTheme(document.getElementById('cG1').value, document.getElementById('cG2').value, document.getElementById('cAC').value);
  });
  h.addEventListener('input', () => {
    if (/^#[0-9a-fA-F]{6}$/.test(h.value)) {
      p.value = h.value;
      document.querySelectorAll('.preset-swatch').forEach(s => s.classList.remove('active'));
      applyTheme(document.getElementById('cG1').value, document.getElementById('cG2').value, document.getElementById('cAC').value);
    }
  });
}

// ── Toast ─────────────────────────────────────────────────────────────────
let _tt;
function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' error' : '');
  clearTimeout(_tt);
  _tt = setTimeout(() => t.classList.remove('show'), 3200);
}

// ── Helpers ───────────────────────────────────────────────────────────────
let _id = Date.now();
function nid() { return ++_id; }
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function clearAll() {
  ['stats-container','skills-container','languages-container','experience-container',
   'education-container','awards-container','references-container','social-container']
    .forEach(id => { document.getElementById(id).innerHTML = ''; });
}

// ── Stats ─────────────────────────────────────────────────────────────────
function addStat(s = { value: '', label: '' }) {
  const id = nid();
  const c  = document.getElementById('stats-container');
  const d  = document.createElement('div');
  d.className = 'dblock';
  d.id = `stat-${id}`;
  d.innerHTML = `
    <button type="button" class="rm-btn" onclick="this.closest('.dblock').remove()" title="Remove">×</button>
    <div class="two-col">
      <div>
        <label>Value</label>
        <input type="text" class="stat-value" value="${esc(s.value)}" placeholder="4+">
      </div>
      <div>
        <label>Label</label>
        <input type="text" class="stat-label" value="${esc(s.label)}" placeholder="Years Experience">
      </div>
    </div>`;
  c.appendChild(d);
}

// ── Skills ────────────────────────────────────────────────────────────────
function addSkill(s = { name: '', level: 80 }) {
  const id = nid();
  const c  = document.getElementById('skills-container');
  const d  = document.createElement('div');
  d.className = 'dblock';
  d.id = `skill-${id}`;
  const lvl = s.level ?? s.progress ?? 80;
  d.innerHTML = `
    <button type="button" class="rm-btn" onclick="this.closest('.dblock').remove()" title="Remove">×</button>
    <div class="two-col">
      <div>
        <label>Skill Name</label>
        <input type="text" class="skill-name" value="${esc(s.name)}" placeholder="Graphic Design">
      </div>
      <div>
        <label>Level (0–100)</label>
        <div class="level-row">
          <input type="range" class="skill-range" min="0" max="100" value="${lvl}">
          <span class="lval skill-val">${lvl}</span>%
        </div>
      </div>
    </div>`;
  c.appendChild(d);
  d.querySelector('.skill-range').addEventListener('input', function() {
    d.querySelector('.skill-val').textContent = this.value;
  });
}

// ── Languages ─────────────────────────────────────────────────────────────
function addLanguage(l = { name: '', level: 80 }) {
  const id = nid();
  const c  = document.getElementById('languages-container');
  const d  = document.createElement('div');
  d.className = 'dblock';
  d.id = `lang-${id}`;
  const lvl = l.level ?? 80;
  d.innerHTML = `
    <button type="button" class="rm-btn" onclick="this.closest('.dblock').remove()" title="Remove">×</button>
    <div class="two-col">
      <div>
        <label>Language</label>
        <input type="text" class="lang-name" value="${esc(l.name)}" placeholder="Russian">
      </div>
      <div>
        <label>Level (0–100)</label>
        <div class="level-row">
          <input type="range" class="lang-range" min="0" max="100" value="${lvl}">
          <span class="lval lang-val">${lvl}</span>%
        </div>
      </div>
    </div>`;
  c.appendChild(d);
  d.querySelector('.lang-range').addEventListener('input', function() {
    d.querySelector('.lang-val').textContent = this.value;
  });
}

// ── Experience ────────────────────────────────────────────────────────────
function addExperience(e = {}) {
  const id = nid();
  const c  = document.getElementById('experience-container');
  const d  = document.createElement('div');
  d.className = 'dblock';
  d.id = `exp-${id}`;
  const role    = e.role || e.title || '';
  const start   = e.start || '';
  const end     = e.end   || '';
  // details may be array (universal) or responsibilities (legacy)
  const details = Array.isArray(e.details) ? e.details : (e.responsibilities || []);
  d.innerHTML = `
    <button type="button" class="rm-btn" onclick="this.closest('.dblock').remove()" title="Remove">×</button>
    <h3>Experience Entry</h3>
    <div class="two-col">
      <div>

const PLATFORMS = [
  { name: 'LinkedIn',  icon: 'fab fa-linkedin'  },
  { name: 'Dribbble',  icon: 'fab fa-dribbble'  },
  { name: 'Behance',   icon: 'fab fa-behance'   },
  { name: 'Instagram', icon: 'fab fa-instagram' },
  { name: 'GitHub',    icon: 'fab fa-github'    },
  { name: 'Twitter',   icon: 'fab fa-twitter'   },
  { name: 'YouTube',   icon: 'fab fa-youtube'   },
  { name: 'Facebook',  icon: 'fab fa-facebook'  },
];

function addSocial(s = { name: 'LinkedIn', url: '', icon: 'fab fa-linkedin' }) {
  const id   = nid();
  const c    = document.getElementById('social-container');
  const d    = document.createElement('div');
  d.className = 'dblock';
  d.id = `soc-${id}`;

    `<option value="${p.name}" data-icon="${p.icon}" ${p.name===s.name?'selected':''}>${p.name}</option>`
  ).join('');
  d.innerHTML = `
    <button type="button" class="rm-btn" onclick="this.closest('.dblock').remove()" title="Remove">×</button>
    <div class="three-col">
      <div>
        <label>Platform</label>
        <select class="soc-name">${opts}</select>
      </div>
      <div>
        <label>FA Icon Class</label>
        <input type="text" class="soc-icon" value="${esc(s.icon || 'fab fa-linkedin')}" placeholder="fab fa-linkedin">
      </div>
      <div>
        <label>Profile URL</label>
        <input type="url" class="soc-url" value="${esc(s.url || '')}" placeholder="https://…">
      </div>
    </div>`;
  c.appendChild(d);
  // Auto-fill icon when platform changes
  d.querySelector('.soc-name').addEventListener('change', function() {

  });
}

// ── Collect ───────────────────────────────────────────────────────────────
function collectData() {
  const g1 = document.getElementById('cG1').value;
  const g2 = document.getElementById('cG2').value;
  const ac = document.getElementById('cAC').value;
  const fullName = document.getElementById('inp-name').value.trim();

  const stats = [];
  document.querySelectorAll('[id^="stat-"]').forEach(d => {
    const value = d.querySelector('.stat-value')?.value.trim();
    const label = d.querySelector('.stat-label')?.value.trim();
    if (value || label) stats.push({ value: value || '', label: label || '' });
  });

  const skills = [];
  document.querySelectorAll('[id^="skill-"]').forEach(d => {
    const name = d.querySelector('.skill-name')?.value.trim();
    if (name) skills.push({ name, level: parseInt(d.querySelector('.skill-range').value) });
  });

  const languages = [];
  document.querySelectorAll('[id^="lang-"]').forEach(d => {
    const name = d.querySelector('.lang-name')?.value.trim();
    if (name) languages.push({ name, level: parseInt(d.querySelector('.lang-range').value) });
  });

  const experience = [];
  document.querySelectorAll('[id^="exp-"]').forEach(d => {
    const role    = d.querySelector('.exp-role')?.value.trim();
    const company = d.querySelector('.exp-company')?.value.trim();
    if (role || company) experience.push({
      role, company,
      start:   d.querySelector('.exp-start').value.trim(),
      end:     d.querySelector('.exp-end').value.trim(),
      details: d.querySelector('.exp-details').value.split('\n').map(s=>s.trim()).filter(Boolean)
    });
  });

  const education = [];
  document.querySelectorAll('[id^="edu-"]').forEach(d => {
    const degree = d.querySelector('.edu-degree')?.value.trim();
    const institution = d.querySelector('.edu-inst')?.value.trim();
    if (degree || institution) education.push({
      degree, institution,
      start:       d.querySelector('.edu-start').value.trim(),
      end:         d.querySelector('.edu-end').value.trim(),
      description: d.querySelector('.edu-desc').value.trim()
    });
  });

  const awards = [];
  document.querySelectorAll('[id^="award-"]').forEach(d => {
    const title = d.querySelector('.award-title')?.value.trim();
    if (title) awards.push({
      date:        d.querySelector('.award-date').value.trim(),
      title,
      institution: d.querySelector('.award-inst').value.trim(),
      description: d.querySelector('.award-desc').value.trim()
    });
  });

  const references = [];
  document.querySelectorAll('[id^="ref-"]').forEach(d => {
    const name = d.querySelector('.ref-name')?.value.trim();
    if (name) references.push({
      name,
      role:  d.querySelector('.ref-role').value.trim(),
      phone: d.querySelector('.ref-phone').value.trim(),
      email: d.querySelector('.ref-email').value.trim()
    });
  });

  const socials = [];
  document.querySelectorAll('[id^="soc-"]').forEach(d => {
    const url = d.querySelector('.soc-url')?.value.trim();
    if (url) socials.push({
      name: d.querySelector('.soc-name').value,
      icon: d.querySelector('.soc-icon').value.trim(),
      url
    });
  });

  return {
    name:  fullName,
    title: document.getElementById('inp-title').value.trim(),
    about: document.getElementById('inp-about').value.trim(),
    theme: { gradientStart: g1, gradientEnd: g2, accentColor: ac },
    contact: {
      phone:   document.getElementById('inp-phone').value.trim(),
      email:   document.getElementById('inp-email').value.trim(),
      address: document.getElementById('inp-address').value.trim()
    },
    profile: {
      image:   document.getElementById('profileImage').value.trim() || 'assets/profile.jpg',
      eyebrow: document.getElementById('profileEyebrow').value.trim()
    },
    hero: {
      description: document.getElementById('heroDesc').value.trim(),
      image:       document.getElementById('heroImage').value.trim() || 'assets/designer-work.jpg'
    },
    stats, skills, languages, experience, education, awards, references,
    footer: {
      text: document.getElementById('inp-footer').value.trim() || `© {year} ${fullName}. All rights reserved.`,
      socials
    }
  };
}

// ── Load JSON ─────────────────────────────────────────────────────────────
function handleLoad(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      clearAll();

      // Resolve name: universal top-level, or legacy profile.name
      const name = d.name || d.profile?.name || '';
      document.getElementById('inp-name').value    = name;
      document.getElementById('inp-title').value   = d.title || d.hero?.title || '';
      document.getElementById('inp-about').value   = Array.isArray(d.about) ? d.about.join('\n\n') : (d.about || '');
      document.getElementById('inp-phone').value   = d.contact?.phone   || '';
      document.getElementById('inp-email').value   = d.contact?.email   || '';
      document.getElementById('inp-address').value = d.contact?.address || '';
      document.getElementById('profileImage').value   = d.profile?.image   || 'assets/profile.jpg';
      document.getElementById('profileEyebrow').value = d.profile?.eyebrow || '';
      document.getElementById('heroDesc').value  = d.hero?.description || '';
      document.getElementById('heroImage').value = d.hero?.image       || 'assets/designer-work.jpg';
      document.getElementById('inp-footer').value = d.footer?.text || '';

      // Theme
      const t = d.theme || { gradientStart: '#f1f8e9', gradientEnd: '#e8f5e9', accentColor: '#2e7d32' };
      setVals(t.gradientStart, t.gradientEnd, t.accentColor);
      applyTheme(t.gradientStart, t.gradientEnd, t.accentColor);
      document.querySelectorAll('.preset-swatch').forEach(s => s.classList.remove('active'));

      // Stats — support both data.stats (universal) and data.about.stats (legacy)
      const stats = d.stats || d.about?.stats || [];
      stats.forEach(addStat);

      // Skills — support flat array (universal) or grouped with items[].progress (legacy)
      const skillsSrc = d.skills || [];
      if (skillsSrc.length && skillsSrc[0].items) {
        skillsSrc.forEach(grp => grp.items.forEach(s => addSkill({ name: s.name, level: s.progress ?? s.level ?? 80 })));
      } else {
        skillsSrc.forEach(addSkill);
      }

      (d.languages  || []).forEach(addLanguage);
      (d.experience || []).forEach(addExperience);

      // Education can be single object or array
      const eduArr = Array.isArray(d.education) ? d.education : (d.education ? [d.education] : []);
      eduArr.forEach(addEducation);

      (d.awards     || []).forEach(addAward);
      (d.references || []).forEach(addReference);

      // Socials — support footer.socials (universal) and profile.social_links (legacy)
      const socials = d.footer?.socials || d.profile?.social_links || [];
      socials.forEach(s => addSocial({
        name: s.name || s.platform || 'LinkedIn',
        icon: s.icon || `fab fa-${(s.name||s.platform||'linkedin').toLowerCase()}`,
        url:  s.url  || ''
      }));

      showToast('✅ Data loaded successfully!');
    } catch (err) {
      console.error(err);
      showToast('❌ Invalid JSON file.', true);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ── Generate & Download ───────────────────────────────────────────────────
function generateAndDownload() {
  if (!document.getElementById('inp-name').value.trim()) {
    showToast('❌ Please enter your full name first.', true);
    return;
  }
  const data = collectData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'data.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('✅ data.json downloaded!');
}

// ── Preview ───────────────────────────────────────────────────────────────
function openPreview() {
  const data = collectData();
  window.open('index.html#data=' + encodeURIComponent(JSON.stringify(data)), '_blank');
}
