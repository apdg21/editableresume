<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Portfolio Data</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --accent: #4a90e2;
      --accent-dark: #2c3e50;
      --g1: #f0f4f8;
      --g2: #d9e6f2;
      --ac: #4a90e2;
      --bg: #f0f4f8;
      --white: #fff;
      --muted: #7f8c8d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica', 'Arial', sans-serif;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: var(--accent-dark);
      line-height: 1.6;
      padding: 40px 20px 100px;
      min-height: 100vh;
    }

    .form-container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--accent-dark);
      font-size: 2rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 3px solid var(--ac);
    }

    .form-section {
      margin-bottom: 2rem;
      padding: 1.8rem;
      background: var(--white);
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: transform 0.2s;
    }
    .form-section:hover { transform: translateY(-2px); }

    .form-section h2 {
      margin-top: 0;
      margin-bottom: 1.2rem;
      color: var(--ac);
      font-size: 1.2rem;
      border-bottom: 1px solid #dee2e6;
      padding-bottom: 0.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      margin-top: 1rem;
      font-weight: 600;
      font-size: 0.92rem;
      color: #495057;
    }
    label:first-of-type { margin-top: 0; }

    input, textarea, select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 0.97rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--accent-dark);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--ac);
      box-shadow: 0 0 0 3px rgba(74,144,226,0.15);
      background: white;
    }

    textarea { min-height: 90px; resize: vertical; }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* ── Buttons ──────────────────────────────────────────── */
    button {
      background: var(--ac);
      color: white;
      border: none;
      padding: 0.65rem 1.4rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 500;
      margin-top: 12px;
      margin-right: 8px;
      transition: opacity 0.2s, transform 0.15s;
    }
    button:hover { opacity: 0.85; transform: translateY(-1px); }

    .btn-green { background: #28a745; }
    .btn-green:hover { background: #218838; }
    .btn-gray  { background: #6c757d; }
    .btn-gray:hover { background: #5a6268; }
    .btn-red   { background: #dc3545; }
    .btn-red:hover { background: #c82333; }

    /* ── Dynamic blocks ──────────────────────────────────── */
    .array-item {
      background: #f8f9fa;
      padding: 1.1rem;
      margin-bottom: 1rem;
      border-radius: 6px;
      border: 1px solid #dee2e6;
      border-left: 3px solid var(--ac);
      position: relative;
    }
    .array-item h3 {
      font-size: 0.9rem;
      color: var(--ac);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }
    .remove-btn {
      position: absolute;
      top: 0.6rem; right: 0.6rem;
      background: #dc3545;
      color: white;
      border: none;
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      margin: 0; padding: 0;
      line-height: 1;
      transition: background 0.2s;
    }
    .remove-btn:hover { background: #a71d2a; transform: none; }

    /* ── Skill/Language level row ────────────────────────── */
    .level-row { display: flex; align-items: center; gap: 12px; }
    .level-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      background: #dee2e6;
      border-radius: 4px;
      padding: 0; border: none;
    }
    .level-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--ac);
      cursor: pointer;
      border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
    }
    .level-val {
      font-weight: 700;
      font-size: 0.88rem;
      min-width: 42px;
      text-align: center;
      color: var(--accent-dark);
    }

    /* ── Theme Picker ────────────────────────────────────── */
    .preset-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .preset-swatch {
      width: 46px; height: 46px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }
    .preset-swatch:hover { transform: scale(1.12); }
    .preset-swatch.active { border-color: var(--accent-dark); transform: scale(1.1); }
    .preset-swatch .ac-dot {
      position: absolute;
      bottom: 2px; right: 2px;
      width: 13px; height: 13px;
      border-radius: 50%;
      border: 2px solid white;
    }

    .pickers-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .picker-group label { margin: 0 0 8px; font-size: 0.88rem; }
    .picker-inner { display: flex; align-items: center; gap: 8px; }
    .picker-inner input[type="color"] {
      width: 40px; height: 40px;
      border: none; border-radius: 6px;
      cursor: pointer; padding: 0;
      flex-shrink: 0;
    }
    .picker-inner input[type="text"] {
      flex: 1; width: auto;
      padding: 8px 10px;
      font-family: monospace;
      font-size: 0.9rem;
      text-transform: uppercase;
    }
    .preview-strip {
      height: 10px;
      border-radius: 5px;
      margin-top: 14px;
      transition: background 0.3s;
    }

    /* ── Action Bar ──────────────────────────────────────── */
    .action-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 2px solid var(--ac);
      padding: 12px 24px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      z-index: 100;
      box-shadow: 0 -4px 14px rgba(0,0,0,0.10);
    }
    .action-bar button { margin: 0; }

    /* ── Toast ───────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 76px; right: 20px;
      background: white;
      border-left: 4px solid var(--ac);
      border-radius: 6px;
      padding: 13px 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.14);
      font-size: 0.92rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s, transform 0.3s;
      z-index: 200;
      max-width: 300px;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { border-left-color: #dc3545; }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 700px) {
      .two-col     { grid-template-columns: 1fr; }
      .pickers-row { grid-template-columns: 1fr; }
      body { padding: 20px 14px 100px; }
      .form-section { padding: 1.2rem; }
      .action-bar button { flex: 1; min-width: 100px; }
    }
  </style>
</head>
<body>
<div class="form-container">

  <h1><i class="fas fa-pencil-alt"></i> Edit Portfolio Data</h1>

  <!-- ── THEME ─────────────────────────────────────────────── -->
  <div class="form-section">
    <h2>Theme Colors</h2>
    <div class="preset-row" id="presetRow"></div>
    <div class="pickers-row">
      <div class="picker-group">
        <label>Gradient Start</label>
        <div class="picker-inner">
          <input type="color" id="cG1" value="#f0f4f8">
          <input type="text"  id="cG1h" value="#F0F4F8" maxlength="7">
        </div>
      </div>
      <div class="picker-group">
        <label>Gradient End</label>
        <div class="picker-inner">
          <input type="color" id="cG2" value="#d9e6f2">
          <input type="text"  id="cG2h" value="#D9E6F2" maxlength="7">
        </div>
      </div>
      <div class="picker-group">
        <label>Accent Color</label>
        <div class="picker-inner">
          <input type="color" id="cAC" value="#4a90e2">
          <input type="text"  id="cACh" value="#4A90E2" maxlength="7">
        </div>
      </div>
    </div>
    <div class="preview-strip" id="previewStrip"></div>
  </div>

  <!-- ── PROFILE ───────────────────────────────────────────── -->
  <div class="form-section">
    <h2>Profile</h2>
    <div class="two-col">
      <div>
        <label for="profileImage">Profile Image Path</label>
        <input type="text" id="profileImage" placeholder="assets/profile.jpg">
      </div>
      <div>
        <label for="profileEyebrow">Eyebrow Label</label>
        <input type="text" id="profileEyebrow" placeholder="Open to Opportunities">
      </div>
    </div>
  </div>

  <!-- ── BASIC INFO ────────────────────────────────────────── -->
  <div class="form-section">
    <h2>Basic Information</h2>
    <label for="inp-name">Full Name *</label>
    <input type="text" id="inp-name" placeholder="Morgan Maxwell" required>

    <label for="inp-title">Professional Title</label>
    <input type="text" id="inp-title" placeholder="Graphic Designer">

    <label for="inp-about">About / Bio</label>
    <textarea id="inp-about" placeholder="Describe your professional background…"></textarea>
  </div>

  <!-- ── SKILLS ────────────────────────────────────────────── -->
  <div class="form-section">
    <h2>Skills</h2>
    <div id="skills-container"></div>
    <button type="button" class="btn-green" onclick="addSkill()"><i class="fas fa-plus"></i> Add Skill</button>
  </div>

  <!-- ── EDUCATION ─────────────────────────────────────────── -->
  <div class="form-section">
    <h2>Education</h2>
    <div id="education-container"></div>
    <button type="button" class="btn-green" onclick="addEducation()"><i class="fas fa-plus"></i> Add Education</button>
  </div>

  <!-- ── LANGUAGES ─────────────────────────────────────────── -->
  <div class="form-section">
    <h2>Languages</h2>
    <div id="languages-container"></div>
    <button type="button" class="btn-green" onclick="addLanguage()"><i class="fas fa-plus"></i> Add Language</button>
  </div>

  <!-- ── EXPERIENCE ────────────────────────────────────────── -->
  <div class="form-section">
    <h2>Professional Experience</h2>
    <div id="experience-container"></div>
    <button type="button" class="btn-green" onclick="addExperience()"><i class="fas fa-plus"></i> Add Experience</button>
  </div>

  <!-- ── REFERENCES ────────────────────────────────────────── -->
  <div class="form-section">
    <h2>References</h2>
    <div id="references-container"></div>
    <button type="button" class="btn-green" onclick="addReference()"><i class="fas fa-plus"></i> Add Reference</button>
  </div>

  <!-- ── CONTACT ───────────────────────────────────────────── -->
  <div class="form-section">
    <h2>Contact Information</h2>
    <div class="two-col">
      <div>
        <label for="inp-phone">Phone</label>
        <input type="tel"   id="inp-phone"   placeholder="+123-456-7890">
      </div>
      <div>
        <label for="inp-email">Email</label>
        <input type="email" id="inp-email"   placeholder="you@example.com">
      </div>
    </div>
    <div class="two-col">
      <div>
        <label for="inp-website">Website</label>
        <input type="text"  id="inp-website" placeholder="www.yoursite.com">
      </div>
      <div>
        <label for="inp-address">Address</label>
        <input type="text"  id="inp-address" placeholder="123 Anywhere St., Any City">
      </div>
    </div>
  </div>

  <!-- ── FOOTER & SOCIALS ──────────────────────────────────── -->
  <div class="form-section">
    <h2>Footer &amp; Socials</h2>
    <label for="inp-footer">Footer Text</label>
    <input type="text" id="inp-footer" placeholder="© {year} Your Name. All rights reserved.">
    <p style="font-size:0.82rem;color:#999;margin-top:5px">Use <code>{year}</code> for the current year.</p>

    <label style="margin-top:20px">Social Links</label>
    <div id="social-container"></div>
    <button type="button" class="btn-green" onclick="addSocial()"><i class="fas fa-plus"></i> Add Social Link</button>
  </div>

</div><!-- /.form-container -->

<!-- ── ACTION BAR ────────────────────────────────────────── -->
<div class="action-bar">
  <input type="file" id="loadFileInput" accept=".json" style="display:none" onchange="handleLoad(event)">
  <button type="button" class="btn-gray" onclick="document.getElementById('loadFileInput').click()">
    <i class="fas fa-upload"></i> Load JSON
  </button>
  <button type="button" class="btn-green" onclick="generateAndDownload()">
    <i class="fas fa-file-download"></i> Generate &amp; Download
  </button>
  <button type="button" onclick="openPreview()">
    <i class="fas fa-eye"></i> Preview
  </button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── Presets ───────────────────────────────────────────────────────────────
const PRESETS = [
  { label: 'Default',  g1: '#f0f4f8', g2: '#d9e6f2', ac: '#4a90e2' },
  { label: 'Ocean',    g1: '#2c3e50', g2: '#34495e', ac: '#3498db' },
  { label: 'Forest',   g1: '#1a472a', g2: '#2d6a4f', ac: '#52b788' },
  { label: 'Crimson',  g1: '#6b0f1a', g2: '#b91c1c', ac: '#f87171' },
  { label: 'Purple',   g1: '#3b1f5e', g2: '#5b21b6', ac: '#a78bfa' },
  { label: 'Slate',    g1: '#0f172a', g2: '#1e293b', ac: '#38bdf8' },
  { label: 'Amber',    g1: '#78350f', g2: '#92400e', ac: '#fbbf24' },
  { label: 'Teal',     g1: '#134e4a', g2: '#0f766e', ac: '#2dd4bf' },
];

function buildPresets() {
  const row = document.getElementById('presetRow');
  PRESETS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'preset-swatch' + (i === 0 ? ' active' : '');
    btn.title = p.label;
    btn.style.background = `linear-gradient(135deg, ${p.g1}, ${p.g2})`;
    const dot = document.createElement('span');
    dot.className = 'ac-dot';
    dot.style.background = p.ac;
    btn.appendChild(dot);
    btn.addEventListener('click', () => applyPreset(i));
    row.appendChild(btn);
  });
}

function applyPreset(i) {
  const p = PRESETS[i];
  setPickerVals(p.g1, p.g2, p.ac);
  applyTheme(p.g1, p.g2, p.ac);
  document.querySelectorAll('.preset-swatch').forEach((s, j) => s.classList.toggle('active', j === i));
}

function setPickerVals(g1, g2, ac) {
  document.getElementById('cG1').value  = g1;
  document.getElementById('cG1h').value = g1.toUpperCase();
  document.getElementById('cG2').value  = g2;
  document.getElementById('cG2h').value = g2.toUpperCase();
  document.getElementById('cAC').value  = ac;
  document.getElementById('cACh').value = ac.toUpperCase();
  updateStrip();
}

function applyTheme(g1, g2, ac) {
  const r = document.documentElement;
  r.style.setProperty('--g1', g1);
  r.style.setProperty('--g2', g2);
  r.style.setProperty('--ac', ac);
  r.style.setProperty('--accent', ac);
  document.body.style.background = `linear-gradient(135deg, ${g1}, ${g2})`;
  updateStrip();
}

function updateStrip() {
  document.getElementById('previewStrip').style.background =
    `linear-gradient(to right, ${document.getElementById('cG1').value}, ${document.getElementById('cAC').value}, ${document.getElementById('cG2').value})`;
}

function wirePicker(pickId, hexId) {
  const pick = document.getElementById(pickId);
  const hex  = document.getElementById(hexId);
  pick.addEventListener('input', () => {
    hex.value = pick.value.toUpperCase();
    document.querySelectorAll('.preset-swatch').forEach(s => s.classList.remove('active'));
    applyTheme(document.getElementById('cG1').value, document.getElementById('cG2').value, document.getElementById('cAC').value);
  });
  hex.addEventListener('input', () => {
    if (/^#[0-9a-fA-F]{6}$/.test(hex.value)) {
      pick.value = hex.value;
      document.querySelectorAll('.preset-swatch').forEach(s => s.classList.remove('active'));
      applyTheme(document.getElementById('cG1').value, document.getElementById('cG2').value, document.getElementById('cAC').value);
    }
  });
}

// ── Toast ─────────────────────────────────────────────────────────────────
let _tt;
function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' error' : '');
  clearTimeout(_tt);
  _tt = setTimeout(() => t.classList.remove('show'), 3200);
}

// ── Helpers ───────────────────────────────────────────────────────────────
let _id = Date.now();
function nid() { return ++_id; }
function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
    .replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function clearAll() {
  ['skills-container','education-container','languages-container',
   'experience-container','references-container','social-container']
    .forEach(id => { document.getElementById(id).innerHTML = ''; });
}

// ── Skills ────────────────────────────────────────────────────────────────
function addSkill(s = { name: '', level: 80 }) {
  const id = nid();
  const c  = document.getElementById('skills-container');
  const d  = document.createElement('div');
  d.className = 'array-item';
  d.id = `skill-${id}`;
  d.innerHTML = `
    <button type="button" class="remove-btn" onclick="this.closest('.array-item').remove()" title="Remove">×</button>
    <div class="two-col">
      <div>
        <label>Skill Name</label>
        <input type="text" class="skill-name" value="${esc(s.name)}" placeholder="e.g. Graphic Design">
      </div>
      <div>
        <label>Level (0–100)</label>
        <div class="level-row">
          <input type="range" class="skill-range" min="0" max="100" value="${s.level || 80}">
          <span class="level-val skill-val">${s.level || 80}</span>%
        </div>
      </div>
    </div>`;
  c.appendChild(d);
  d.querySelector('.skill-range').addEventListener('input', function() {
    d.querySelector('.skill-val').textContent = this.value;
  });
}

// ── Education ─────────────────────────────────────────────────────────────
function addEducation(e = {}) {
  const id = nid();
  const c  = document.getElementById('education-container');
  const d  = document.createElement('div');
  d.className = 'array-item';
  d.id = `edu-${id}`;
  // Support both universal (institution, start, end) and legacy (university, years)
  const inst  = e.institution || e.university || '';
  const start = e.start || '';
  const end   = e.end   || '';
  const desc  = e.description || e.address || '';
  d.innerHTML = `
    <button type="button" class="remove-btn" onclick="this.closest('.array-item').remove()" title="Remove">×</button>
    <h3>Education Entry</h3>
    <label>Degree</label>
    <input type="text" class="edu-degree" value="${esc(e.degree)}" placeholder="Bachelor of Fine Arts in Graphic Design">
    <label>Institution</label>
    <input type="text" class="edu-inst" value="${esc(inst)}" placeholder="University Name">
    <div class="two-col">
      <div>
        <label>Start Year</label>
        <input type="text" class="edu-start" value="${esc(start)}" placeholder="2016">
      </div>
      <div>
        <label>End Year</label>
        <input type="text" class="edu-end" value="${esc(end)}" placeholder="2020">
      </div>
    </div>
    <label>Location / Description (optional)</label>
    <input type="text" class="edu-desc" value="${esc(desc)}" placeholder="123 Anywhere St., Any City">`;
  c.appendChild(d);
}

// ── Languages ─────────────────────────────────────────────────────────────
function addLanguage(l = { name: '', level: 80 }) {
  const id = nid();
  const c  = document.getElementById('languages-container');
  const d  = document.createElement('div');
  d.className = 'array-item';
  d.id = `lang-${id}`;
  d.innerHTML = `
    <button type="button" class="remove-btn" onclick="this.closest('.array-item').remove()" title="Remove">×</button>
    <div class="two-col">
      <div>
        <label>Language</label>
        <input type="text" class="lang-name" value="${esc(l.name)}" placeholder="e.g. Russian">
      </div>
      <div>
        <label>Level (0–100)</label>
        <div class="level-row">
          <input type="range" class="lang-range" min="0" max="100" value="${l.level || 80}">
          <span class="level-val lang-val">${l.level || 80}</span>%
        </div>
      </div>
    </div>`;
  c.appendChild(d);
  d.querySelector('.lang-range').addEventListener('input', function() {
    d.querySelector('.lang-val').textContent = this.value;
  });
}

// ── Experience ────────────────────────────────────────────────────────────
function addExperience(e = {}) {
  const id = nid();
  const c  = document.getElementById('experience-container');
  const d  = document.createElement('div');
  d.className = 'array-item';
  d.id = `exp-${id}`;
  const role  = e.role  || e.title || '';
  const start = e.start || '';
  const end   = e.end   || '';
  // details can be array (universal) or string (legacy)
  const detailsText = Array.isArray(e.details)
    ? e.details.join('\n')
    : (e.description || '');
  d.innerHTML = `
    <button type="button" class="remove-btn" onclick="this.closest('.array-item').remove()" title="Remove">×</button>
    <h3>Experience Entry</h3>
    <div class="two-col">
      <div>
        <label>Job Title / Role</label>
        <input type="text" class="exp-role" value="${esc(role)}" placeholder="Senior Graphic Designer">
      </div>
      <div>
        <label>Company</label>
        <input type="text" class="exp-company" value="${esc(e.company)}" placeholder="Company Name">
      </div>
    </div>
    <div class="two-col">
      <div>
        <label>Start</label>
        <input type="text" class="exp-start" value="${esc(start)}" placeholder="June 2022">
      </div>
      <div>
        <label>End</label>
        <input type="text" class="exp-end" value="${esc(end)}" placeholder="May 2024">
      </div>
    </div>
    <label>Details / Achievements (one per line)</label>
    <textarea class="exp-details" placeholder="Each bullet point on its own line">${esc(detailsText)}</textarea>`;
  c.appendChild(d);
}

// ── References ────────────────────────────────────────────────────────────
function addReference(r = {}) {
  const id = nid();
  const c  = document.getElementById('references-container');
  const d  = document.createElement('div');
  d.className = 'array-item';
  d.id = `ref-${id}`;
  d.innerHTML = `
    <button type="button" class="remove-btn" onclick="this.closest('.array-item').remove()" title="Remove">×</button>
    <div class="two-col">
      <div>
        <label>Name</label>
        <input type="text" class="ref-name" value="${esc(r.name)}" placeholder="Jane Smith">
      </div>
      <div>
        <label>Role / Company</label>
        <input type="text" class="ref-role" value="${esc(r.role)}" placeholder="Creative Director, Acme Co.">
      </div>
    </div>
    <div class="two-col">
      <div>
        <label>Phone</label>
        <input type="tel"   class="ref-phone" value="${esc(r.phone)}" placeholder="+123-456-7890">
      </div>
      <div>
        <label>Email</label>
        <input type="email" class="ref-email" value="${esc(r.email)}" placeholder="jane@example.com">
      </div>
    </div>`;
  c.appendChild(d);
}

// ── Social ────────────────────────────────────────────────────────────────
const PLATFORMS = ['LinkedIn','Dribbble','Behance','Instagram','GitHub','Twitter','YouTube','Facebook'];

function addSocial(s = { name: 'LinkedIn', url: '', icon: '' }) {
  const id = nid();
  const c  = document.getElementById('social-container');
  const d  = document.createElement('div');
  d.className = 'array-item';
  d.id = `soc-${id}`;
  const opts = PLATFORMS.map(p => `<option value="${p}" ${p===s.name?'selected':''}>${p}</option>`).join('');
  d.innerHTML = `
    <button type="button" class="remove-btn" onclick="this.closest('.array-item').remove()" title="Remove">×</button>
    <div class="two-col">
      <div>
        <label>Platform</label>
        <select class="soc-name">${opts}</select>
      </div>
      <div>
        <label>Profile URL</label>
        <input type="url" class="soc-url" value="${esc(s.url)}" placeholder="https://…">
      </div>
    </div>`;
  c.appendChild(d);
}

// ── Collect Data ──────────────────────────────────────────────────────────
function collectData() {
  const g1 = document.getElementById('cG1').value;
  const g2 = document.getElementById('cG2').value;
  const ac = document.getElementById('cAC').value;
  const fullName = document.getElementById('inp-name').value.trim();

  const skills = [];
  document.querySelectorAll('[id^="skill-"]').forEach(d => {
    const name = d.querySelector('.skill-name')?.value.trim();
    if (name) skills.push({ name, level: parseInt(d.querySelector('.skill-range').value) });
  });

  const education = [];
  document.querySelectorAll('[id^="edu-"]').forEach(d => {
    const degree = d.querySelector('.edu-degree')?.value.trim();
    const institution = d.querySelector('.edu-inst')?.value.trim();
    if (degree || institution) education.push({
      degree, institution,
      start:       d.querySelector('.edu-start').value.trim(),
      end:         d.querySelector('.edu-end').value.trim(),
      description: d.querySelector('.edu-desc').value.trim()
    });
  });

  const languages = [];
  document.querySelectorAll('[id^="lang-"]').forEach(d => {
    const name = d.querySelector('.lang-name')?.value.trim();
    if (name) languages.push({ name, level: parseInt(d.querySelector('.lang-range').value) });
  });

  const experience = [];
  document.querySelectorAll('[id^="exp-"]').forEach(d => {
    const role    = d.querySelector('.exp-role')?.value.trim();
    const company = d.querySelector('.exp-company')?.value.trim();
    if (role || company) experience.push({
      role, company,
      start:   d.querySelector('.exp-start').value.trim(),
      end:     d.querySelector('.exp-end').value.trim(),
      details: d.querySelector('.exp-details').value.split('\n').map(s=>s.trim()).filter(Boolean)
    });
  });

  const references = [];
  document.querySelectorAll('[id^="ref-"]').forEach(d => {
    const name = d.querySelector('.ref-name')?.value.trim();
    if (name) references.push({
      name,
      role:  d.querySelector('.ref-role').value.trim(),
      phone: d.querySelector('.ref-phone').value.trim(),
      email: d.querySelector('.ref-email').value.trim()
    });
  });

  const socials = [];
  document.querySelectorAll('[id^="soc-"]').forEach(d => {
    const url = d.querySelector('.soc-url')?.value.trim();
    if (url) {
      const name = d.querySelector('.soc-name').value;
      socials.push({ name, url, icon: name.toLowerCase() });
    }
  });

  const website = document.getElementById('inp-website').value.trim();

  return {
    name:  fullName,
    title: document.getElementById('inp-title').value.trim(),
    about: document.getElementById('inp-about').value.trim(),
    theme: { gradientStart: g1, gradientEnd: g2, accentColor: ac },
    contact: {
      phone:   document.getElementById('inp-phone').value.trim(),
      email:   document.getElementById('inp-email').value.trim(),
      address: document.getElementById('inp-address').value.trim(),
      website
    },
    profile: {
      image:   document.getElementById('profileImage').value.trim() || 'assets/profile.jpg',
      eyebrow: document.getElementById('profileEyebrow').value.trim()
    },
    skills, education, languages, experience, references,
    footer: {
      text: document.getElementById('inp-footer').value.trim() || `© {year} ${fullName}. All rights reserved.`,
      socials
    }
  };
}

// ── Load JSON ─────────────────────────────────────────────────────────────
function handleLoad(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      clearAll();

      // Support both legacy and universal schema
      document.getElementById('inp-name').value    = d.name || '';
      document.getElementById('inp-title').value   = d.title || '';
      document.getElementById('inp-about').value   = Array.isArray(d.about) ? d.about.join('\n\n') : (d.about || '');
      document.getElementById('inp-phone').value   = d.contact?.phone   || '';
      document.getElementById('inp-email').value   = d.contact?.email   || '';
      document.getElementById('inp-address').value = d.contact?.address || '';
      document.getElementById('inp-website').value = d.contact?.website || '';
      document.getElementById('profileImage').value   = d.profile?.image   || 'assets/profile.jpg';
      document.getElementById('profileEyebrow').value = d.profile?.eyebrow || '';
      document.getElementById('inp-footer').value  = d.footer?.text || '';

      // Theme
      const t = d.theme || { gradientStart: '#f0f4f8', gradientEnd: '#d9e6f2', accentColor: '#4a90e2' };
      setPickerVals(t.gradientStart, t.gradientEnd, t.accentColor);
      applyTheme(t.gradientStart, t.gradientEnd, t.accentColor);
      document.querySelectorAll('.preset-swatch').forEach(s => s.classList.remove('active'));

      // Dynamic sections
      (d.skills     || []).forEach(addSkill);
      // education can be single object or array
      const eduArr = Array.isArray(d.education) ? d.education : (d.education ? [d.education] : []);
      eduArr.forEach(addEducation);
      (d.languages  || []).forEach(addLanguage);
      (d.experience || []).forEach(addExperience);
      (d.references || []).forEach(addReference);

      // Socials — support footer.socials and legacy contact.social
      const socials = d.footer?.socials || d.contact?.social || [];
      socials.forEach(addSocial);

      showToast('✅ Data loaded successfully!');
    } catch {
      showToast('❌ Invalid JSON file.', true);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ── Generate & Download ───────────────────────────────────────────────────
function generateAndDownload() {
  if (!document.getElementById('inp-name').value.trim()) {
    showToast('❌ Please enter your full name first.', true);
    return;
  }
  const data = collectData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'data.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('✅ data.json downloaded!');
}

// ── Preview ───────────────────────────────────────────────────────────────
function openPreview() {
  const data = collectData();
  window.open('index.html#data=' + encodeURIComponent(JSON.stringify(data)), '_blank');
}

// ── Init ──────────────────────────────────────────────────────────────────
buildPresets();
wirePicker('cG1','cG1h');
wirePicker('cG2','cG2h');
wirePicker('cAC','cACh');
applyPreset(0);

// Seed one of each
addSkill();
addEducation();
addLanguage();
addExperience();
addReference();
addSocial();
</script>
